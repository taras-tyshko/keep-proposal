<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>KEEP — MVP Proposal</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --ink: #1b1a17; --ink-2: #4a463f; --muted: #7d776d;
    --line: #e6e1d8; --accent: #a8542a; --accent-soft: #f6ece5; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 0 28px 72px; }

  /* toolbar */
  .toolbar { position: sticky; top: 0; z-index: 20; background: rgba(251,250,248,.94);
    backdrop-filter: saturate(140%) blur(8px); border-bottom: 1px solid var(--line); }
  .toolbar-inner { max-width: 1020px; margin: 0 auto; padding: 10px 28px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1 1 auto; }
  .switch-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); overflow: hidden; }
  .switch button { appearance: none; border: 0; background: transparent; cursor: pointer; font: inherit;
    font-size: 13px; font-weight: 550; color: var(--ink-2); padding: 7px 14px; }
  .switch button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .switch button + button { border-left: 1px solid var(--line); }
  .btn { appearance: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 550;
    background: var(--panel); color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  /* hero */
  .hero { padding: 54px 0 34px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 650; }
  h1 { font-size: 40px; line-height: 1.12; margin: 12px 0 10px; letter-spacing: -.02em; font-weight: 680; }
  .hero .sub { font-size: 18px; color: var(--ink-2); margin: 0 0 26px; max-width: 62ch; }
  .parties { display: flex; gap: 40px; flex-wrap: wrap; }
  .party { min-width: 240px; }
  .party .role { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .party a { color: var(--ink); text-decoration: none; font-weight: 620; display: inline-flex;
    align-items: center; gap: 7px; border-bottom: 1px solid var(--line); }
  .party a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .party a svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .party .headline, .party .meta { font-size: 13.5px; color: var(--muted); margin-top: 5px; max-width: 42ch; }

  /* kpis + summary */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 30px 0 0; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .kpi .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .kpi .v { font-size: 26px; font-weight: 660; letter-spacing: -.02em; margin-top: 6px; }
  .kpi .n { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .kpi .v.dual { font-size: 19px; }
  .kpi .v .to { color: var(--muted); font-weight: 500; margin: 0 6px; }

  /* side-by-side plan comparison */
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0 4px; }
  .cmp { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 4px; background: var(--panel); }
  .cmp.pick { border-color: var(--accent); }
  .cmp > h4 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
  .cmp > .cmp-name { font-weight: 640; letter-spacing: -.01em; margin-bottom: 8px; }
  .cmp ul.clean li { font-size: 14.5px; }

  /* brand marks: monochrome, brand colour on hover of the row or card they sit in */
  .ic { width: 15px; height: 15px; flex: 0 0 auto; fill: var(--ink-2); vertical-align: -2px;
    transition: fill .15s ease; }
  li:hover .ic { fill: var(--bc, var(--accent)); }
  tr:hover .ic, .cmp:hover .ic, .logostrip a:hover .ic, h3:hover .ic { fill: var(--bc, var(--accent)); }
  .with-ic { display: inline-flex; align-items: center; gap: 8px; }
  .ic-chip { display: inline-flex; align-items: center; justify-content: center; height: 15px; padding: 0 4px;
    border: 1px solid var(--line); border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: .04em;
    color: var(--muted); background: #fff; flex: 0 0 auto; }
  tr:hover .ic-chip, .cmp:hover .ic-chip { color: var(--accent); border-color: var(--accent); }
  h3 .ic, h3 .ic-chip { width: 17px; height: 17px; }
  .logostrip { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center;
    padding: 16px 0 2px; border-top: 1px solid var(--line); margin-top: 22px; }
  .logostrip a { display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    color: var(--muted); font-size: 13px; font-weight: 550; }
  .logostrip a:hover { color: var(--ink); }
  .dicon { fill: var(--muted); }
  .summary { padding: 30px 0 26px; }

  h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 650; margin: 0 0 14px; }
  h3 { font-size: 20px; font-weight: 640; letter-spacing: -.01em; margin: 26px 0 12px; }
  h3:first-child { margin-top: 0; }
  p { margin: 0 0 14px; max-width: 78ch; color: var(--ink-2); }
  p strong, li strong { color: var(--ink); font-weight: 620; }
  .lead { font-size: 17px; }

  /* chapters */
  .chapters { margin-top: 8px; }
  .ch { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
  .ch > summary { cursor: pointer; list-style: none; display: flex; gap: 16px; align-items: baseline; padding: 16px 20px; }
  .ch > summary::-webkit-details-marker { display: none; }
  .ch > summary:hover .ch-t { color: var(--accent); }
  .ch-num { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; color: var(--accent);
    letter-spacing: .06em; min-width: 24px; }
  .ch-titles { flex: 1 1 auto; }
  .ch-t { display: block; font-size: 18px; font-weight: 640; letter-spacing: -.01em; }
  .ch-s { display: block; font-size: 14px; color: var(--muted); margin-top: 3px; }
  .ch-chev { color: var(--muted); font-size: 12px; transition: transform .15s ease; }
  .ch[open] > summary .ch-chev { transform: rotate(90deg); }
  .ch-body { padding: 16px 20px 22px; border-top: 1px solid var(--line); }

  ul.clean { list-style: none; margin: 0 0 14px; padding: 0; }
  ul.clean > li { position: relative; padding-left: 18px; margin-bottom: 10px; max-width: 80ch; color: var(--ink-2); }
  ul.clean > li::before { content: ""; position: absolute; left: 2px; top: .68em; width: 5px; height: 5px;
    border-radius: 50%; background: var(--accent); }

  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card { background: #fdfcfa; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .card h4 { margin: 0 0 6px; font-size: 15.5px; font-weight: 620; }
  .card p { margin: 0; font-size: 14.5px; }

  .note { background: var(--accent-soft); border: 1px solid #ecd9cc; border-radius: var(--radius);
    padding: 14px 16px; font-size: 14.5px; color: var(--ink-2); margin: 16px 0 6px; }
  .note strong { color: var(--ink); }
  .todo { border: 1px dashed #d9d2c6; border-radius: var(--radius); padding: 14px 16px;
    font-size: 14px; color: var(--muted); background: #fdfcfa; }

  /* tables */
  table { width: 100%; border-collapse: collapse; font-size: 15px; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: #fdfcfa; }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.total td { background: #fdfcfa; font-weight: 640; color: var(--ink); border-top: 2px solid var(--line); }
  tr.sub td { background: #fdfcfa; color: var(--ink); font-weight: 600; }
  td .desc { display: block; color: var(--muted); font-size: 13.5px; margin-top: 3px; max-width: 64ch; }

  /* gantt */
  .gantt { background: #fdfcfa; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .gantt-row { display: grid; align-items: center; gap: 10px; margin-bottom: 8px; }
  .gantt-head { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .gantt-label { font-size: 14px; color: var(--ink-2); }
  .gantt-track { display: grid; gap: 3px; }
  .gantt-cell { height: 22px; border-radius: 4px; background: #f1ede6; }
  .gantt-cell.on { background: var(--accent); }
  .gantt-cell.head { height: auto; background: transparent; text-align: center; font-size: 11px; color: var(--muted); }

  /* diagram */
  .diagram { background: #fdfcfa; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
  .diagram svg { width: 100%; height: auto; display: block; }
  .dbox { fill: #fff; stroke: var(--line); stroke-width: 1.2; }
  .dbox.accent { fill: var(--accent-soft); stroke: #e3c6b3; }
  .dgroup { fill: #faf8f5; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .dlabel { font: 600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; fill: var(--ink); }
  .dsub { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; fill: var(--muted); }
  .dgtitle { font: 650 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    fill: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
  .darrow { stroke: #b6afa4; stroke-width: 1.4; fill: none; }
  .darrow.dashed { stroke-dasharray: 5 4; }
  .dcaption { font-size: 13.5px; color: var(--muted); margin-top: 10px; }

  footer { border-top: 1px solid var(--line); margin-top: 28px; padding-top: 18px; font-size: 13px; color: var(--muted); }

  @media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, 1fr); } .compare { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    .wrap { padding: 0 18px 56px; }
    h1 { font-size: 30px; }
    .kpis, .cards { grid-template-columns: 1fr; }
  }

  @page { margin: 14mm; }
  @media print {
    .no-print { display: none !important; }
    body { font-size: 10.5pt; background: #fff; }
    .wrap { max-width: none; padding: 0; }
    .hero { padding-top: 0; }
    h1 { font-size: 24pt; }
    .ch { break-inside: avoid; }
    .ch > summary { padding: 10px 0; }
    .ch-body { padding: 10px 0 14px; }
    .ch, .card, .gantt, .diagram { border-color: #ddd; }
    h2, h3, .ch > summary { break-after: avoid; }
    .card, .kpi, table, .gantt, .diagram, .note, .cmp { break-inside: avoid; }
    .party a { border-bottom: 0; }
    .party a::after { content: " (" attr(href) ")"; font-weight: 400; font-size: 9pt; color: #777; }
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="toolbar-inner">
    <span class="switch-label" id="lbl-lang"></span>
    <div class="switch" role="group" aria-label="Language">

      <button type="button" data-lang="uk">UA</button>

    <span class="switch-label" id="lbl-scenario"></span>
    <div class="switch" role="group" aria-label="Scenario">
      <button type="button" data-scenario="a"></button>
      <button type="button" data-scenario="b"></button>
      <button type="button" data-scenario="diff"></button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="btn" id="btn-toggle-all"></button>
    <button type="button" class="btn" id="btn-print"></button>
  </div>
</div>

<div class="wrap">

      <div class="party">
        <div class="role" id="role-by"></div>
        <a href="https://www.linkedin.com/in/taras-tyshko/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.22.79 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>

      </div>

  </header>

  <div class="kpis" id="kpis"></div>
  <div class="summary" id="summary"></div>
  <div class="chapters" id="chapters"></div>

  <footer id="page-footer"></footer>
</div>

          { t: "1. \u042F\u043A\u0456\u0441\u0442\u044C \u0432\u0438\u0432\u043E\u0434\u0443 Claude", d: "\u041D\u0430\u0439\u0441\u043A\u043B\u0430\u0434\u043D\u0456\u0448\u0435 \u0442\u0443\u0442 \u043D\u0435 \u043A\u043E\u0434, \u0430 \u0442\u0435, \u0449\u043E\u0431 \u0442\u0435\u043A\u0441\u0442 \u0437\u0432\u0443\u0447\u0430\u0432 \u044F\u043A \u0436\u0438\u0442\u0442\u044F \u043B\u044E\u0434\u0438\u043D\u0438, \u0430 \u043D\u0435 \u044F\u043A \u0448\u0430\u0431\u043B\u043E\u043D. \u0429\u043E \u0440\u043E\u0431\u043B\u044E: \u0441\u0443\u0432\u043E\u0440\u0430 \u0441\u0445\u0435\u043C\u0430 \u0432\u0438\u0432\u043E\u0434\u0443 \u0437 \u0432\u0430\u043B\u0456\u0434\u0430\u0446\u0456\u0454\u044E \u0434\u043E \u0437\u0431\u0435\u0440\u0435\u0436\u0435\u043D\u043D\u044F, \u043F\u0440\u043E\u043C\u043F\u0442\u0438 \u043F\u0456\u0434 \u043A\u043E\u043D\u0442\u0440\u043E\u043B\u0435\u043C \u0432\u0435\u0440\u0441\u0456\u0439, \u0448\u043B\u044F\u0445 \u0440\u0435\u0433\u0435\u043D\u0435\u0440\u0430\u0446\u0456\u0457 \u0456 \u043F\u043E\u0437\u043D\u0430\u0447\u043A\u0430 \u043D\u0430 \u043F\u0435\u0440\u0435\u0432\u0456\u0440\u043A\u0443 \u0434\u043B\u044F \u0441\u0443\u043C\u043D\u0456\u0432\u043D\u0438\u0445 Chapters. \u0426\u0435 \u0439 \u0433\u043E\u043B\u043E\u0432\u043D\u0430 \u043F\u0440\u0438\u0447\u0438\u043D\u0430 \u0431\u0443\u0444\u0435\u0440\u0430 contingency." },
          { t: "2. \u0412\u0430\u0440\u0442\u0456\u0441\u0442\u044C \u043E\u0434\u043D\u0456\u0454\u0457 \u0433\u0435\u043D\u0435\u0440\u0430\u0446\u0456\u0457", d: "\u041D\u0456\u0445\u0442\u043E \u043D\u0435 \u0437\u043D\u0430\u0454, \u0441\u043A\u0456\u043B\u044C\u043A\u0438 \u043A\u043E\u0448\u0442\u0443\u0454 Chapter, \u043F\u043E\u043A\u0438 \u0440\u0435\u0430\u043B\u044C\u043D\u0456 \u043F\u0440\u043E\u043C\u043F\u0442\u0438 \u043D\u0435 \u0437\u0443\u0441\u0442\u0440\u0456\u043D\u0443\u0442\u044C \u0440\u0435\u0430\u043B\u044C\u043D\u0443 \u043A\u0456\u043B\u044C\u043A\u0456\u0441\u0442\u044C \u0444\u043E\u0442\u043E. \u0429\u043E \u0440\u043E\u0431\u043B\u044E: \u043B\u043E\u0433\u0443\u044E \u0432\u0430\u0440\u0442\u0456\u0441\u0442\u044C \u0442\u043E\u043A\u0435\u043D\u0456\u0432 \u043F\u043E \u043A\u043E\u0436\u043D\u0456\u0439 \u0437\u0430\u0434\u0430\u0447\u0456 \u0437 \u043F\u0435\u0440\u0448\u043E\u0433\u043E \u0434\u043D\u044F, \u0436\u043E\u0440\u0441\u0442\u043A\u0438\u0439 \u043B\u0456\u043C\u0456\u0442 \u043D\u0430 \u0437\u0430\u043C\u043E\u0432\u043B\u0435\u043D\u043D\u044F \u0456 \u0432\u0438\u0434\u0438\u043C\u0443 \u0446\u0438\u0444\u0440\u0443 cost-per-KEEP, \u0449\u043E\u0431 \u043F\u043E\u043C\u0438\u043B\u043A\u0430 \u0432 \u0446\u0456\u043D\u0456 \u0432\u0438\u043F\u043B\u0438\u0432\u043B\u0430 \u043D\u0430 \u0434\u0435\u0432\u02BC\u044F\u0442\u043E\u043C\u0443 \u0442\u0438\u0436\u043D\u0456, \u0430 \u043D\u0435 \u043D\u0430 \u0447\u0435\u0442\u0432\u0435\u0440\u0442\u043E\u043C\u0443 \u043C\u0456\u0441\u044F\u0446\u0456." },
          { t: "3. \u0414\u043E\u0432\u0433\u0456 \u0433\u0435\u043D\u0435\u0440\u0430\u0446\u0456\u0457 \u0456 \u0442\u0430\u0439\u043C\u0430\u0443\u0442\u0438", d: "\u0417\u0430\u043F\u0443\u0441\u043A \u0456\u0437 \u0431\u0430\u0433\u0430\u0442\u044C\u043C\u0430 \u0444\u043E\u0442\u043E \u043C\u043E\u0436\u0435 \u0442\u0440\u0438\u0432\u0430\u0442\u0438 \u0445\u0432\u0438\u043B\u0438\u043D\u0438 \u0456 \u0432\u043F\u0430\u0441\u0442\u0438 \u043D\u0430 \u043F\u0456\u0432\u0434\u043E\u0440\u043E\u0437\u0456. \u0429\u043E \u0440\u043E\u0431\u043B\u044E: Oban-\u0437\u0430\u0434\u0430\u0447\u0456 \u043F\u043E \u043A\u0440\u043E\u043A\u0430\u0445 \u0456\u0437 backoff, \u043A\u043B\u044E\u0447\u0456 \u0456\u0434\u0435\u043C\u043F\u043E\u0442\u0435\u043D\u0442\u043D\u043E\u0441\u0442\u0456, \u0449\u043E\u0431 retry \u043D\u0435 \u043F\u0440\u043E\u0434\u0443\u0431\u043B\u044E\u0432\u0430\u0432 \u0440\u043E\u0431\u043E\u0442\u0443, \u0456 \u0437\u0431\u0435\u0440\u0435\u0436\u0435\u043D\u0456 \u0447\u0430\u0441\u0442\u043A\u043E\u0432\u0456 \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\u0442\u0438, \u0449\u043E\u0431 \u043F\u043E\u0432\u0442\u043E\u0440 \u043F\u0440\u043E\u0434\u043E\u0432\u0436\u0443\u0432\u0430\u0432, \u0430 \u043D\u0435 \u043F\u043E\u0447\u0438\u043D\u0430\u0432 \u0437 \u043D\u0443\u043B\u044F." },
          { t: "4. Edge cases \u0443 \u043F\u043B\u0430\u0442\u0435\u0436\u0430\u0445", d: "\u041F\u043E\u0432\u0442\u043E\u0440\u043D\u0456 webhooks, \u043F\u043E\u0432\u0435\u0440\u043D\u0435\u043D\u043D\u044F \u043F\u0456\u0441\u043B\u044F \u0433\u0435\u043D\u0435\u0440\u0430\u0446\u0456\u0457, \u0443\u0441\u043F\u0456\u0448\u043D\u0430 \u043E\u043F\u043B\u0430\u0442\u0430 \u043F\u0440\u0438 \u0437\u0430\u043A\u0440\u0438\u0442\u043E\u043C\u0443 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0456. \u0429\u043E \u0440\u043E\u0431\u043B\u044E: \u043E\u0431\u0440\u043E\u0431\u043D\u0438\u043A\u0438 webhook \u0437\u0430 Stripe event id, entitlements \u044F\u043A \u043E\u043A\u0440\u0435\u043C\u0438\u0439 \u0437\u0430\u043F\u0438\u0441, \u0430 \u043D\u0435 boolean \u043D\u0430 \u043A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447\u0435\u0432\u0456, \u0456 \u0442\u0435\u0441\u0442, \u044F\u043A\u0438\u0439 \u043F\u0440\u043E\u0433\u0440\u0430\u0454 webhook \u0434\u0432\u0456\u0447\u0456." },
          { t: "5. \u0417\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0435\u043D\u043D\u044F \u0437\u0456 \u0441\u043F\u0440\u0430\u0432\u0436\u043D\u0456\u0445 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0456\u0432", d: "HEIC \u0437 iPhone, \u0444\u043E\u0442\u043E \u043D\u0430 40 \u041C\u0411, \u043D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0430 \u043E\u0440\u0456\u0454\u043D\u0442\u0430\u0446\u0456\u044F, \u043A\u0443\u043B\u044C\u0433\u0430\u0432\u0438\u0439 \u043C\u043E\u0431\u0456\u043B\u044C\u043D\u0438\u0439 \u0456\u043D\u0442\u0435\u0440\u043D\u0435\u0442. \u0429\u043E \u0440\u043E\u0431\u043B\u044E: presigned \u043F\u0440\u044F\u043C\u0435 \u0437\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0435\u043D\u043D\u044F, \u0437\u043C\u0435\u043D\u0448\u0435\u043D\u043D\u044F \u043D\u0430 \u043A\u043B\u0456\u0454\u043D\u0442\u0456 \u0434\u043E \u0432\u0456\u0434\u043F\u0440\u0430\u0432\u043A\u0438, \u043A\u043E\u043D\u0432\u0435\u0440\u0442\u0430\u0446\u0456\u044F \u043D\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0456 \u0456 \u0432\u0456\u0434\u043D\u043E\u0432\u043B\u0435\u043D\u043D\u044F \u0437\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0435\u043D\u043D\u044F \u0442\u0430\u043C, \u0434\u0435 \u0432\u0442\u0440\u0430\u0442\u0430 \u043A\u043E\u0448\u0442\u0443\u0432\u0430\u043B\u0430 \u0431 \u043D\u0430\u0439\u0431\u0456\u043B\u044C\u0448\u0435." },
          { t: "6. \u0410\u0443\u0434\u0456\u043E \u0456 \u0442\u0440\u0430\u043D\u0441\u043A\u0440\u0438\u0431\u0430\u0446\u0456\u044F", d: "\u0410\u043A\u0446\u0435\u043D\u0442\u0438, \u0444\u043E\u043D\u043E\u0432\u0438\u0439 \u0448\u0443\u043C, \u0434\u0432\u0456 \u043C\u043E\u0432\u0438 \u0432 \u043E\u0434\u043D\u043E\u043C\u0443 \u0437\u0430\u043F\u0438\u0441\u0456. \u0429\u043E \u0440\u043E\u0431\u043B\u044E: \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u044E \u043E\u0440\u0438\u0433\u0456\u043D\u0430\u043B \u0430\u0443\u0434\u0456\u043E \u0440\u0430\u0437\u043E\u043C \u0456\u0437 \u0442\u0440\u0430\u043D\u0441\u043A\u0440\u0438\u043F\u0442\u043E\u043C, \u0434\u0430\u044E \u043A\u043E\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u0447\u0446\u0456 \u043F\u0440\u043E\u0447\u0438\u0442\u0430\u0442\u0438 \u0439 \u043F\u043E\u043F\u0440\u0430\u0432\u0438\u0442\u0438 \u0442\u0435\u043A\u0441\u0442 \u0434\u043E \u0433\u0435\u043D\u0435\u0440\u0430\u0446\u0456\u0457 \u0456 \u043D\u0456\u043A\u043E\u043B\u0438 \u043D\u0435 \u0432\u0432\u0430\u0436\u0430\u044E \u0442\u0440\u0430\u043D\u0441\u043A\u0440\u0438\u043F\u0442 \u0454\u0434\u0438\u043D\u0438\u043C \u0437\u0430\u043F\u0438\u0441\u043E\u043C \u0441\u043A\u0430\u0437\u0430\u043D\u043E\u0433\u043E." },
          { t: "7. \u041E\u0431\u0441\u044F\u0433 Intake", d: "\u0414\u0432\u0430\u0434\u0446\u044F\u0442\u044C \u043A\u0440\u043E\u043A\u0456\u0432 \u2014 \u0446\u0435 \u0437\u0430\u0433\u043E\u043B\u043E\u0432\u043E\u043A; \u0441\u043F\u0440\u0430\u0432\u0436\u043D\u044F \u0432\u0430\u0440\u0442\u0456\u0441\u0442\u044C \u2014 \u0432 \u0443\u043C\u043E\u0432\u043D\u0438\u0445 \u0433\u0456\u043B\u043A\u0430\u0445. \u041A\u043E\u0436\u043D\u0435 \u201E\u044F\u043A\u0449\u043E \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u043B\u0430 X, \u043F\u0438\u0442\u0430\u0439 Y\u201C \u043C\u043D\u043E\u0436\u0438\u0442\u044C UI, \u0432\u0430\u043B\u0456\u0434\u0430\u0446\u0456\u044E \u0456 \u0440\u043E\u0431\u043E\u0442\u0443 \u0437 \u043F\u0440\u043E\u043C\u043F\u0442\u0430\u043C\u0438. \u0429\u043E \u0440\u043E\u0431\u043B\u044E: \u0444\u0456\u043D\u0430\u043B\u044C\u043D\u0438\u0439 \u0441\u043F\u0438\u0441\u043E\u043A \u043F\u0438\u0442\u0430\u043D\u044C \u043F\u043E\u0433\u043E\u0434\u0436\u0435\u043D\u0438\u0439 \u0434\u043E \u0441\u0442\u0430\u0440\u0442\u0443 \u0431\u043B\u043E\u043A\u0443 Intake \u2014 \u0446\u0435 \u043D\u0430\u0439\u0431\u0456\u043B\u044C\u0448\u0438\u0439 \u0432\u0430\u0436\u0456\u043B\u044C \u0432\u043F\u043B\u0438\u0432\u0443 \u043D\u0430 \u043E\u0446\u0456\u043D\u043A\u0443." },
          { t: "8. \u0412\u0438\u0434\u0430\u043B\u0435\u043D\u043D\u044F, \u044F\u043A\u0435 \u0441\u043F\u0440\u0430\u0432\u0434\u0456 \u0432\u0438\u0434\u0430\u043B\u044F\u0454", d: "\u041E\u0441\u043E\u0431\u0438\u0441\u0442\u0456 \u0444\u043E\u0442\u043E \u0439 \u0433\u043E\u043B\u043E\u0441 \u043F\u0456\u0434 UK GDPR. \u0429\u043E \u0440\u043E\u0431\u043B\u044E: \u0432\u0438\u0434\u0430\u043B\u0435\u043D\u043D\u044F \u0437\u043D\u043E\u0441\u0438\u0442\u044C \u0440\u044F\u0434\u043A\u0438 \u0431\u0430\u0437\u0438 \u0439 \u043E\u0431\u02BC\u0454\u043A\u0442\u0438 storage \u0440\u0430\u0437\u043E\u043C, \u0442\u0435\u0440\u043C\u0456\u043D \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u043D\u043D\u044F \u0431\u0435\u043A\u0430\u043F\u0456\u0432 \u0437\u0430\u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u043E\u0432\u0430\u043D\u0438\u0439, \u0430 AI-\u043F\u0440\u043E\u0432\u0430\u0439\u0434\u0435\u0440 \u043F\u0440\u0430\u0446\u044E\u0454 \u0437 zero-retention." }
        ]
      }
    }[c.lang];

        h3: "\u042F\u043A \u0431\u0438 \u044F \u043F\u043E\u0447\u0438\u043D\u0430\u0432",
        items: [
          "<strong>\u0414\u0437\u0432\u0456\u043D\u043E\u043A \u043D\u0430 \u0442\u0440\u0438\u0434\u0446\u044F\u0442\u044C \u0445\u0432\u0438\u043B\u0438\u043D</strong> \u2014 \u043F\u0440\u043E\u0439\u0442\u0438\u0441\u044F \u043F\u043E \u0446\u044C\u043E\u043C\u0443 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0443 \u0439 \u043F\u043E\u0447\u0443\u0442\u0438, \u0434\u0435 \u044F \u043F\u0440\u043E\u0447\u0438\u0442\u0430\u0432 \u0422\u0417 \u043D\u0435 \u0442\u0430\u043A, \u044F\u043A \u0432\u0438 \u0437\u0430\u0434\u0443\u043C\u0443\u0432\u0430\u043B\u0438.",
          "<strong>\u041E\u043F\u043B\u0430\u0447\u0443\u0432\u0430\u043D\u0438\u0439 discovery \u043D\u0430 \u0432\u0456\u0441\u0456\u043C\u2013\u0434\u0432\u0430\u043D\u0430\u0434\u0446\u044F\u0442\u044C \u0433\u043E\u0434\u0438\u043D</strong> \u2014 " + CURRENCY + (RATE * 8) + "\u2013" + CURRENCY + (RATE * 12) + " \u2014 \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\u0442\u043E\u043C \u044F\u043A\u043E\u0433\u043E \u0454 \u0444\u0456\u043D\u0430\u043B\u044C\u043D\u0430 \u0441\u043F\u0435\u0446\u0438\u0444\u0456\u043A\u0430\u0446\u0456\u044F Intake, \u0442\u043E\u0447\u043D\u0430 \u043E\u0446\u0456\u043D\u043A\u0430 \u0439 \u0434\u043E\u0448\u043A\u0430 GitHub \u2014 \u0443\u0441\u0435 \u0432\u0430\u0448\u0435, \u0449\u043E\u0431 \u0432\u0438 \u043D\u0435 \u0432\u0438\u0440\u0456\u0448\u0438\u043B\u0438 \u0434\u0430\u043B\u0456. \u042F\u043A\u0449\u043E \u043F\u0440\u0430\u0446\u044E\u0454\u043C\u043E \u0434\u0430\u043B\u0456 \u2014 \u0446\u044F \u0441\u0443\u043C\u0430 \u0439\u0434\u0435 \u0432 \u0437\u0430\u043B\u0456\u043A.",
          "<strong>\u0414\u0430\u043B\u0456 \u043F\u0435\u0440\u0448\u0430 \u0432\u0456\u0445\u0430:</strong> \u0440\u043E\u0437\u0433\u043E\u0440\u043D\u0443\u0442\u0438\u0439 \u043A\u0430\u0440\u043A\u0430\u0441 \u043D\u0430 \u0432\u0430\u0448\u043E\u043C\u0443 \u0434\u043E\u043C\u0435\u043D\u0456 \u043D\u0430 \u0434\u0440\u0443\u0433\u043E\u043C\u0443 \u0442\u0438\u0436\u043D\u0456 \u2014 \u043D\u0430\u0439\u0434\u0435\u0448\u0435\u0432\u0448\u0438\u0439 \u043C\u043E\u043C\u0435\u043D\u0442 \u0437\u0440\u043E\u0437\u0443\u043C\u0456\u0442\u0438, \u0447\u0438 \u043D\u0430\u043C \u0434\u043E\u0431\u0440\u0435 \u043F\u0440\u0430\u0446\u044E\u0454\u0442\u044C\u0441\u044F \u0440\u0430\u0437\u043E\u043C."
        ],
        note: "\u041E\u0446\u0456\u043D\u043A\u0430 \u0434\u0456\u0439\u0441\u043D\u0430 \u0442\u0440\u0438\u0434\u0446\u044F\u0442\u044C \u0434\u043D\u0456\u0432. \u0417\u0430\u0440\u0430\u0437 \u043C\u0430\u044E \u043C\u043E\u0436\u043B\u0438\u0432\u0456\u0441\u0442\u044C \u0441\u0442\u0430\u0440\u0442\u0443\u0432\u0430\u0442\u0438 \u043F\u0440\u043E\u0442\u044F\u0433\u043E\u043C \u0434\u0432\u043E\u0445 \u0442\u0438\u0436\u043D\u0456\u0432 \u0432\u0456\u0434 \u043F\u0456\u0434\u043F\u0438\u0441\u0430\u043D\u043E\u0433\u043E scope."
      }
    }[c.lang];

    var rows = copy.rows.map(function (r) {
      return "<tr><td style=\"width:22%\"><strong>" + r[0] + "</strong></td><td>" + r[1] + "</td></tr>";
    }).join("");

    return "<p class=\"lead\">" + copy.lead + "</p>"
      + "<table><tbody>" + rows + "</tbody></table>"
      + "<h3>" + copy.h3 + "</h3>" + c.list(copy.items)
      + "<div class=\"note\">" + copy.note + "</div>";
  };

  /* In diff mode chapters render both plans side by side instead of one. */
  function compare(t, aBody, bBody, o) {
    o = o || {};
    return "<div class=\"compare\">"
      + "<div class=\"cmp" + (o.pick === "a" ? " pick" : "") + "\"><h4>" + t.planA + "</h4>"
      + "<div class=\"cmp-name\">" + (o.aName || t.planAShort) + "</div>" + aBody + "</div>"
      + "<div class=\"cmp" + (o.pick === "b" ? " pick" : "") + "\"><h4>" + t.planB + "</h4>"
      + "<div class=\"cmp-name\">" + (o.bName || t.planBShort) + "</div>" + bBody + "</div>"
      + "</div>";
  }

  function ctx() {
    var t = T[state.lang];
    var sc = state.scenario;
    return { t: t, sc: sc, diff: sc === "diff", lang: state.lang, list: list, cards: cards,
             mark: mark, withMark: withMark,
             money: money, compare: function (a, b, o) { return compare(t, a, b, o); },
             RATE: RATE, CURRENCY: CURRENCY, CONTINGENCY: CONTINGENCY, BLOCKS: BLOCKS,
             FRONTEND: FRONTEND, WEEKS: WEEKS, sumHours: sumHours };
  }

  function renderKpis() {
    var c = ctx();
    var rows;

    if (c.diff) {
      var dual = function (a, b) {
        return "<span>" + a + "</span><span class=\"to\">\u2192</span><span>" + b + "</span>";
      };
      var coreA = sumHours("a"), coreB = sumHours("b");
      var feA = sumHours("a", FRONTEND), feB = sumHours("b", FRONTEND);
      rows = [
        { k: c.t.kpiCore, v: dual(money(coreA * RATE), money(coreB * RATE)),
          n: coreA + " \u2192 " + coreB + " h \u00B7 " + c.t.kpiCoreNote, dual: true },
        { k: c.t.kpiFront, v: dual(money(feA * RATE), money(feB * RATE)),
          n: feA + " \u2192 " + feB + " h \u00B7 " + c.t.kpiFrontNote, dual: true },
        { k: c.t.kpiTotal, v: dual(money((coreA + feA) * RATE), money((coreB + feB) * RATE)),
          n: (coreA + feA) + " \u2192 " + (coreB + feB) + " h \u00B7 " + c.t.kpiCostNote, dual: true },
        { k: c.t.kpiTime, v: dual(WEEKS.a + " " + c.t.weeks, WEEKS.b + " " + c.t.weeks),
          n: c.t.kpiTimeNote, dual: true }
      ];
    } else {
      var core = sumHours(c.sc);
      var fe = sumHours(c.sc, FRONTEND);
      rows = [
        { k: c.t.kpiCore, v: money(core * RATE), n: core + " h \u00B7 " + c.t.kpiCoreNote },
        { k: c.t.kpiFront, v: money(fe * RATE), n: fe + " h \u00B7 " + c.t.kpiFrontNote },
        { k: c.t.kpiTotal, v: money((core + fe) * RATE), n: (core + fe) + " h \u00B7 " + c.t.kpiCostNote },
        { k: c.t.kpiTime, v: WEEKS[c.sc] + " " + c.t.weeks, n: c.t.kpiTimeNote }
      ];
    }

    el("kpis").innerHTML = rows.map(function (x) {
      return "<div class=\"kpi\"><div class=\"k\">" + x.k + "</div><div class=\"v"
        + (x.dual ? " dual" : "") + "\">" + x.v
        + "</div><div class=\"n\">" + x.n + "</div></div>";
    }).join("");
  }

  function renderSummary() {
    el("summary").innerHTML = SUMMARY ? SUMMARY(ctx()) : "";
  }

  function renderChapters() {
    var c = ctx();
    el("chapters").innerHTML = CHAPTERS.map(function (ch, i) {
      var titles = ch[state.lang];
      var body = RENDERERS[ch.id] ? RENDERERS[ch.id](c) : "<div class=\"todo\">" + c.t.todo + "</div>";
      return "<details class=\"ch\" data-ch=\"" + ch.id + "\"" + (state.open.has(ch.id) ? " open" : "") + ">"
        + "<summary><span class=\"ch-num\">" + pad(i + 1) + "</span>"
        + "<span class=\"ch-titles\"><span class=\"ch-t\">" + titles[0] + "</span>"
        + "<span class=\"ch-s\">" + titles[1] + "</span></span>"
        + "<span class=\"ch-chev\">\u25B8</span></summary>"
        + "<div class=\"ch-body\">" + body + "</div></details>";
    }).join("");

    el("chapters").querySelectorAll("details.ch").forEach(function (d) {
      d.addEventListener("toggle", function () {
        if (d.open) state.open.add(d.dataset.ch); else state.open.delete(d.dataset.ch);
        localStorage.setItem("keep.open", JSON.stringify(Array.from(state.open)));
        el("btn-toggle-all").textContent = allOpen() ? T[state.lang].collapseAll : T[state.lang].expandAll;
      });
    });
  }

  function allOpen() { return state.open.size === CHAPTERS.length; }

  function render() {
    var t = T[state.lang];

    document.documentElement.lang = state.lang === "uk" ? "uk" : "en";
    document.title = t.docTitle;

    el("lbl-lang").textContent = t.lang;
    el("lbl-scenario").textContent = t.scenario;
    el("btn-print").textContent = t.print;
    el("btn-toggle-all").textContent = allOpen() ? t.collapseAll : t.expandAll;
    document.querySelector("[data-scenario=\"a\"]").textContent = t.scenarioA;
    document.querySelector("[data-scenario=\"b\"]").textContent = t.scenarioB;
    document.querySelector("[data-scenario=\"diff\"]").textContent = t.scenarioDiff;

    el("hero-eyebrow").textContent = t.eyebrow;
    el("hero-title").textContent = t.title;
    el("hero-sub").textContent = t.sub;
    el("role-for").textContent = t.roleFor;
    el("role-by").textContent = t.roleBy;
    el("for-headline").textContent = t.forHeadline;
    el("by-headline").textContent = t.byHeadline;
    el("by-meta").textContent = t.byMeta;
    el("page-footer").textContent = t.footer;

    renderKpis();
    renderSummary();
    renderChapters();

    document.querySelectorAll("[data-lang]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang));
    });
    document.querySelectorAll("[data-scenario]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.scenario === state.scenario));
    });
  }

  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () {
      state.lang = b.dataset.lang;
      localStorage.setItem("keep.lang", state.lang);
      render();
    });
  });

  document.querySelectorAll("[data-scenario]").forEach(function (b) {
    b.addEventListener("click", function () {
      state.scenario = b.dataset.scenario;
      localStorage.setItem("keep.scenario", state.scenario);
      render();
    });
  });

  el("btn-toggle-all").addEventListener("click", function () {
    state.open = allOpen() ? new Set() : new Set(CHAPTERS.map(function (c) { return c.id; }));
    localStorage.setItem("keep.open", JSON.stringify(Array.from(state.open)));
    render();
  });

  el("btn-print").addEventListener("click", function () { window.print(); });

  /* A collapsed chapter prints as a missing chapter, so open everything first. */
  var printRestore = null;
  window.addEventListener("beforeprint", function () {
    printRestore = new Set(state.open);
    el("chapters").querySelectorAll("details.ch").forEach(function (d) { d.open = true; });
  });
  window.addEventListener("afterprint", function () {
    if (!printRestore) return;
    el("chapters").querySelectorAll("details.ch").forEach(function (d) {
      d.open = printRestore.has(d.dataset.ch);
    });
    printRestore = null;
  });

  window.KEEP = {
    RENDERERS: RENDERERS,
    setSummary: function (fn) { SUMMARY = fn; },
    render: render
  };

  render();
})();
</script>

</body>
</html>
